appId: com.fratelanza.grand-erp
productName: Fratelanza Grand ERP
copyright: Copyright © Fratelanza
electronVersion: 34.0.0
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    - nsis
  artifactName: Fratelanza-ERP-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Fratelanza Grand ERP
publish: null
