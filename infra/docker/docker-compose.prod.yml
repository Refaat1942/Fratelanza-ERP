# Production stack for G-ERP.fratelanza.com
# Set secrets in .env.production (never commit real values)

services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_eval}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fratelanza} -d ${POSTGRES_DB:-fratelanza_eval}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: fratelanza-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fratelanza}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fratelanza_eval}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      APP_URL: ${APP_URL:-https://g-erp.fratelanza.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://g-erp.fratelanza.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://g-erp.fratelanza.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    expose:
      - '3000'

  web:
    image: nginx:1.27-alpine
    container_name: fratelanza-web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      - ../nginx/g-erp.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  certbot_etc:
  certbot_www:
