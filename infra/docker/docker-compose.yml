services:
  postgres:
    image: postgres:16-alpine
    container_name: fratelanza-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fratelanza
      POSTGRES_PASSWORD: fratelanza_dev
      POSTGRES_DB: fratelanza_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fratelanza -d fratelanza_erp']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
