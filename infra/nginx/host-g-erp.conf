# Install on VPS host nginx (NOT inside Docker):
#   cp infra/nginx/host-g-erp.conf /etc/nginx/sites-available/g-erp.fratelanza.com
#   ln -sf /etc/nginx/sites-available/g-erp.fratelanza.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Requires Docker web bound to 127.0.0.1:8080 (see docker-compose.prod.yml).

server {
    listen 80;
    server_name g-erp.fratelanza.com;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
